# ~/.tmux.conf - Multi-tab development-focused tmux configuration

# Pick a softer palette.
set -g @catppuccin_flavor 'frappe'



# Ensure that everything on the right side of the status line
# is included.
#set -g status-right-length 100

set -g status-left-length 15
set -g status-right-length 30

#set -g @catppuccin_flavour 'frappe'
set -g @catppuccin_window_text " #{?#{!=:#W,zsh},#W,#T}"
set -g @catppuccin_window_current_text " #{?#{!=:#W,zsh},#W,#T}"
set -g @catppuccin_window_current_number_color "#{E:@thm_blue}"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_status_date_time "%a, %B %d %Y %H:%M"
set -g @catppuccin_status_background "none"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
set -g status-left ""
set -g @catppuccin_window_default_text "#W"
set -g status-right "#[fg=#{@thm_bg},bg=#{@thm_surface_0},reverse]#[none]"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Show activity in other windows
setw -g monitor-activity on
set -g visual-activity off

set-option -g set-titles on
set-option -g set-titles-string "#{session_name}"
set -g focus-events on

# End catppucin configuration



# Change prefix key from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Set correct terminal type
set -g default-terminal "tmux-256color"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0 (easier keyboard navigation)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 100000

# Navigate between windows with Alt+Left/Right (like browser tabs)
bind -n M-Left previous-window
bind -n M-Right next-window

bind D rename-window "claude" \;\
    new-window -n "terminal" -c "#{pane_current_path}" \;\
    new-window -n "server" -c "#{pane_current_path}" \;\
    new-window -n "git" -c "#{pane_current_path}" \;\
    select-window -t "claude"
bind Q run-shell 'tmux kill-session'
